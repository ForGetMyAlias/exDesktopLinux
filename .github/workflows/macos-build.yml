name: macOS build

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # prepare.py hardcodes fetch_archive.py as $ROOT_DIR/tdesktop/..., where
      # $ROOT_DIR is the checkout's parent directory, so it needs a sibling
      # named "tdesktop" pointing back at the actual checkout.
      - name: Link checkout as tdesktop
        run: ln -s "$GITHUB_WORKSPACE" "$(dirname "$GITHUB_WORKSPACE")/tdesktop"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install build dependencies
        run: brew install automake libtool cmake wget pkg-config gnu-tar ninja nasm meson

      - name: Cache ThirdParty libraries
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/../Libraries
            ${{ github.workspace }}/../ThirdParty
          key: mac-libs-${{ hashFiles('Telegram/build/prepare/prepare.py', 'Telegram/build/prepare/mac.sh') }}

      - name: Build ThirdParty libraries
        run: ./Telegram/build/prepare/mac.sh silent

      - name: Configure
        working-directory: Telegram
        run: |
          ./configure.sh \
            -D TDESKTOP_API_ID=${{ secrets.TDESKTOP_API_ID }} \
            -D TDESKTOP_API_HASH=${{ secrets.TDESKTOP_API_HASH }} \
            -D CMAKE_OSX_ARCHITECTURES=arm64

      - name: Build
        working-directory: out
        run: cmake --build . --config Release --target Telegram

      - name: Package
        working-directory: out/Release
        run: |
          ditto -c -k --sequesterRsrc --keepParent Telegram.app \
            "$GITHUB_WORKSPACE/exteraDesktop-macos-arm64.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: exteraDesktop-macos-arm64
          path: exteraDesktop-macos-arm64.zip

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" "exteraDesktop-macos-arm64.zip"
