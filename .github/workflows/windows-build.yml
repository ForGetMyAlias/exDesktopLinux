name: Windows build

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # prepare.py expects the checkout to be a folder literally named
      # "tdesktop" sitting right next to Libraries/ThirdParty, same deal
      # as the macOS workflow.
      - name: Link checkout as tdesktop
        shell: cmd
        run: mklink /J "%GITHUB_WORKSPACE%\..\tdesktop" "%GITHUB_WORKSPACE%"

      - name: Find vcvars64.bat
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          echo "VCVARS64=$vsPath\VC\Auxiliary\Build\vcvars64.bat" >> $env:GITHUB_ENV

      - name: Restore ThirdParty libraries
        id: libs
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ github.workspace }}\..\Libraries
            ${{ github.workspace }}\..\ThirdParty
          key: win-libs-${{ hashFiles('Telegram/build/prepare/prepare.py', 'Telegram/build/prepare/win.bat') }}

      - name: Build ThirdParty libraries
        shell: cmd
        run: |
          call "%VCVARS64%" -vcvars_ver=14.44
          Telegram\build\prepare\win.bat silent

      - name: Save ThirdParty libraries
        if: steps.libs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ github.workspace }}\..\Libraries
            ${{ github.workspace }}\..\ThirdParty
          key: ${{ steps.libs.outputs.cache-primary-key }}

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      # -vcvars_ver=14.44 is what docs/building-win.md pins for Windows 7
      # support. If a runner's VS install doesn't ship that exact toolset
      # this will fail and needs adjusting to whatever is actually there.
      - name: Configure and build
        shell: cmd
        run: |
          call "%VCVARS64%" -vcvars_ver=14.44
          cd Telegram
          call configure.bat x64 -D TDESKTOP_API_ID=${{ secrets.TDESKTOP_API_ID }} -D TDESKTOP_API_HASH=${{ secrets.TDESKTOP_API_HASH }}
          cd ..\out
          msbuild Telegram.slnx /t:Telegram /p:Configuration=Release /m

      - name: Package
        shell: pwsh
        run: |
          $release = Join-Path $env:GITHUB_WORKSPACE 'out\Release'
          $versionHeader = Get-Content 'Telegram\SourceFiles\core\version.h' -Raw
          if ($versionHeader -notmatch 'AppVersionStr\s*=\s*"([^"]+)"') { throw 'AppVersionStr was not found' }
          $version = $Matches[1]
          $packageVersion = $version
          if ($env:GITHUB_EVENT_NAME -eq 'release') { $packageVersion = $env:GITHUB_REF_NAME.TrimStart('v') }
          $portable = Join-Path $env:GITHUB_WORKSPACE 'exDesktop-windows-x64'
          New-Item -ItemType Directory -Path $portable -Force | Out-Null
          Copy-Item (Join-Path $release 'Telegram.exe') $portable
          Copy-Item (Join-Path $release 'python') $portable -Recurse
          Copy-Item (Join-Path $release 'modules') $portable -Recurse
          if (Test-Path (Join-Path $release 'Updater.exe')) { Copy-Item (Join-Path $release 'Updater.exe') $portable }
          $portableZip = "exDesktop-portable-x64.$packageVersion.zip"
          Compress-Archive -Path (Join-Path $portable '*') -DestinationPath (Join-Path $env:GITHUB_WORKSPACE $portableZip) -Force
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $setup = Join-Path $env:GITHUB_WORKSPACE 'Telegram\build\setup.iss'
          $setupArgs = @(
            '/dSkipSign',
            "/dMyAppVersion=$version",
            "/dMyAppVersionZero=$version.0",
            "/dMyAppVersionFull=$packageVersion",
            "/dMyOutputBaseFilename=exDesktop-setup-x64.$packageVersion",
            "/dReleasePath=$release",
            '/dMyBuildTarget=win64',
            $setup
          )
          & $iscc @setupArgs
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed' }
          "BUILD_VERSION=$packageVersion" >> $env:GITHUB_ENV

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: exDesktop-windows-x64
          path: |
            exDesktop-portable-x64.*.zip
            out/Release/exDesktop-setup-x64.*.exe

      - name: Attach to release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$env:RELEASE_TAG" "exDesktop-portable-x64.$env:BUILD_VERSION.zip" "out\Release\exDesktop-setup-x64.$env:BUILD_VERSION.exe" --clobber
